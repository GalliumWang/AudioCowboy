body:
  - type: textBlock
    attributes:
      description: |
        AudioCowboy — quickly switch the default audio output/input device and manage
        device profiles. Open the menu by typing the action keyword (default: ac).
        Works out of the box with the bundled pure-Python backend — no external tools
        needed.
  - type: checkbox
    attributes:
      name: show_disconnected
      label: Show disconnected / disabled devices
      description: When on, unplugged or disabled endpoints are listed too (you usually want this off).
      defaultValue: false
  - type: checkbox
    attributes:
      name: boom3d_compatibility
      label: Boom3D compatibility mode
      description: When an output switch is accepted but Boom3D restores its active virtual output, show a request confirmation instead of a default-device warning. Physical routing is managed by Boom3D. Input and backend errors are still checked.
      defaultValue: false
